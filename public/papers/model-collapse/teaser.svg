<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Selection bias and collaborative verification teaser</title>
  <desc id="desc">A schematic comparing local sample selection bias with collaborative Wasserstein verification in recursive synthetic-data training.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#54595d"/>
    </marker>
    <linearGradient id="leftWash" x1="0" x2="1">
      <stop offset="0" stop-color="#f8f9fa"/>
      <stop offset="1" stop-color="#fff4f0"/>
    </linearGradient>
    <linearGradient id="rightWash" x1="0" x2="1">
      <stop offset="0" stop-color="#f8f9fa"/>
      <stop offset="1" stop-color="#eef7f4"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="898" height="358" fill="#fff" stroke="#a2a9b1"/>
  <rect x="24" y="48" width="390" height="246" rx="8" fill="url(#leftWash)" stroke="#c8ccd1"/>
  <rect x="486" y="48" width="390" height="246" rx="8" fill="url(#rightWash)" stroke="#c8ccd1"/>

  <text x="24" y="28" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#202122">Recursive synthetic-data selection</text>
  <text x="219" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#202122">Local biased verifier</text>
  <text x="681" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#202122">Collaborative Wasserstein proxy</text>

  <ellipse cx="142" cy="178" rx="84" ry="58" fill="none" stroke="#3366aa" stroke-width="2" stroke-dasharray="6 5"/>
  <ellipse cx="250" cy="178" rx="84" ry="58" fill="none" stroke="#aa6633" stroke-width="2" stroke-dasharray="6 5"/>
  <ellipse cx="200" cy="177" rx="34" ry="28" fill="#ba0000" fill-opacity="0.12" stroke="#ba0000" stroke-width="2"/>
  <path d="M205 118 C222 139 227 165 219 198 C214 218 224 238 246 251" fill="none" stroke="#ba0000" stroke-width="2.5"/>
  <g fill="#3366aa">
    <circle cx="96" cy="165" r="5"/><circle cx="113" cy="198" r="5"/><circle cx="137" cy="139" r="5"/>
    <circle cx="157" cy="207" r="5"/><circle cx="181" cy="157" r="5"/>
  </g>
  <g fill="#aa6633">
    <circle cx="245" cy="141" r="5"/><circle cx="276" cy="165" r="5"/><circle cx="303" cy="205" r="5"/>
    <circle cx="260" cy="226" r="5"/><circle cx="220" cy="203" r="5"/>
  </g>
  <g fill="#ba0000">
    <circle cx="190" cy="172" r="5"/><circle cx="205" cy="184" r="5"/><circle cx="214" cy="162" r="5"/>
  </g>
  <path d="M178 260 C205 275 239 275 270 260" fill="none" stroke="#54595d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="218" y="281" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#54595d">selected region repeats</text>

  <ellipse cx="604" cy="178" rx="82" ry="56" fill="none" stroke="#3366aa" stroke-width="2" stroke-dasharray="6 5"/>
  <ellipse cx="742" cy="178" rx="82" ry="56" fill="none" stroke="#aa6633" stroke-width="2" stroke-dasharray="6 5"/>
  <ellipse cx="673" cy="178" rx="112" ry="70" fill="#14866d" fill-opacity="0.10" stroke="#14866d" stroke-width="2"/>
  <path d="M604 153 C636 128 710 128 742 153" fill="none" stroke="#14866d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M742 203 C710 228 636 228 604 203" fill="none" stroke="#14866d" stroke-width="3" marker-end="url(#arrow)"/>
  <g fill="#3366aa">
    <circle cx="558" cy="164" r="5"/><circle cx="580" cy="204" r="5"/><circle cx="615" cy="139" r="5"/>
    <circle cx="633" cy="213" r="5"/><circle cx="660" cy="161" r="5"/>
  </g>
  <g fill="#aa6633">
    <circle cx="725" cy="141" r="5"/><circle cx="764" cy="166" r="5"/><circle cx="790" cy="207" r="5"/>
    <circle cx="741" cy="229" r="5"/><circle cx="700" cy="207" r="5"/>
  </g>
  <g fill="#14866d">
    <circle cx="649" cy="183" r="5"/><circle cx="682" cy="165" r="5"/><circle cx="705" cy="194" r="5"/>
  </g>
  <text x="674" y="281" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#54595d">global proxy checks mode coverage</text>

  <path d="M428 174 L470 174" stroke="#54595d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="449" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#54595d">replace</text>

  <text x="70" y="320" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#202122">Risk: verifier rewards a narrow local slice, so recursive training loses tails.</text>
  <text x="520" y="320" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#202122">Aim: aggregate distributional evidence without exchanging raw data.</text>
</svg>
