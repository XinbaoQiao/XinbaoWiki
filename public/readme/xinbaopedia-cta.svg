  <text x="720" y="151" text-anchor="middle" fill="#1d1d1f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',Arial,sans-serif" font-size="28" font-weight="600">Stop publishing pages.</text>
