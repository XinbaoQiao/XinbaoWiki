<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc"><title id="title">Stop publishing pages. Start shipping knowledge.</title><desc id="desc">Xinbaopedia product call to action</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#0b1533"/><stop offset=".55" stop-color="#17295a"/><stop offset="1" stop-color="#42246f"/></linearGradient><linearGradient id="a"><stop stop-color="#70a7ff"/><stop offset=".5" stop-color="#9a7cff"/><stop offset="1" stop-color="#60d5b2"/></linearGradient></defs><rect width="1440" height="360" rx="28" fill="url(#b)"/><rect x="1" y="1" width="1438" height="358" rx="27" fill="none" stroke="#a9bfff" stroke-opacity=".2"/><rect x="72" y="60" width="178" height="28" rx="14" fill="#fff" fill-opacity=".08"/><circle cx="90" cy="74" r="4" fill="#70a7ff"/><text x="103" y="79" fill="#dce8ff" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.6">XINBAOPEDIA</text><text x="72" y="151" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Stop publishing pages.</text><text x="72" y="205" fill="#8fb3ff" font-family="Arial,sans-serif" font-size="46" font-weight="800">Start shipping knowledge.</text><text x="74" y="251" fill="#c8d4ef" font-family="Arial,sans-serif" font-size="18">A bilingual academic product people can explore, question, verify, and reuse.</text><rect x="72" y="281" width="178" height="40" rx="10" fill="#fff"/><text x="107" y="307" fill="#14234c" font-family="Arial,sans-serif" font-size="14" font-weight="700">EXPLORE LIVE</text><rect x="968" y="49" width="382" height="262" rx="19" fill="#f8fbff" fill-opacity=".09" stroke="#d9e6ff" stroke-opacity=".25"/><rect x="968" y="49" width="382" height="42" rx="19" fill="#fff" fill-opacity=".06"/><circle cx="994" cy="70" r="4" fill="#ff7a90"/><circle cx="1008" cy="70" r="4" fill="#ffc76a"/><circle cx="1022" cy="70" r="4" fill="#62d6b3"/><g font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#eef4ff"><rect x="994" y="111" width="330" height="38" rx="9" fill="#70a7ff" fill-opacity=".18"/><text x="1020" y="135">BROWSE</text><rect x="994" y="160" width="330" height="38" rx="9" fill="#60d5b2" fill-opacity=".15"/><text x="1020" y="184">SEARCH</text><rect x="994" y="209" width="330" height="38" rx="9" fill="#9a7cff" fill-opacity=".17"/><text x="1020" y="233">ASK</text><rect x="994" y="258" width="330" height="38" rx="9" fill="#f2a65a" fill-opacity=".15"/><text x="1020" y="282">VERIFY</text></g></svg>